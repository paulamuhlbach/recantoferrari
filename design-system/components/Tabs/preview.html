<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Tabs</title>
<style>
  body { margin:0; padding:16px; background:var(--surface); color:var(--on-surface); font-family:var(--font-body); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.RecantoFerrari, h = React.createElement;
  function App() {
    var s = React.useState('proximas'), v = s[0], set = s[1];
    var s2 = React.useState('novo'), v2 = s2[0], set2 = s2[1];
    return h('div', { className: 'col' },
      h(R.Tabs, { label: 'Reservas', value: v, onChange: set,
        items: [{ value: 'proximas', label: 'Próximas', count: 2 }, { value: 'historico', label: 'Histórico' }, { value: 'espacos', label: 'Espaços', icon: 'home' }] }),
      h(R.Tabs, { label: 'Situação', variant: 'secondary', value: v2, onChange: set2,
        items: [{ value: 'todas', label: 'Todas', count: 9, tone: 'neutral' }, { value: 'novo', label: 'Novas', count: 2, tone: 'info' }, { value: 'em_andamento', label: 'Em andamento', count: 3, tone: 'warning' },
          { value: 'respondido', label: 'Respondidas', count: 4, tone: 'success' }, { value: 'concluido', label: 'Concluídas', count: 0, tone: 'neutral' }] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
