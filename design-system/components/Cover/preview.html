<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recanto Ferrari</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--on-surface); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .t1 { fill:var(--terracotta-1); }
  .t2 { fill:var(--terracotta-2); }
  .t3 { fill:var(--terracotta-3); }
  .t4 { fill:var(--terracotta-4); }
  .bl { fill:var(--blue-2); }
  .blk { rx:var(--radius-xs); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:88px; line-height:.95; font-weight:600; letter-spacing:-.5px; color:var(--on-surface); }
  .tag { margin:var(--space-3) 0 0 3px; font-size:14px; line-height:20px; color:var(--on-surface-variant); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      terracotta-1 slab 224×200 bled off the top and right (the centre roof, the brand's darkest) · terracotta-4 sand 208×88 · terracotta-3 wall 152×80 · blue-2 56×80 once (secondary, links) — about 40% of 960×288
  arrangement one tall terracotta slab with a low street of blocks along the bottom edge, space-2 gutters, all bleeding off the bottom like ground
  pattern     literal motif, the logo's roofs: three space-8-wide roofs on the sand block, dark one in the middle as in the mark, overlapping by space-2; five small roofs cut into the slab in terracotta-3
  scales      sides in space-2 multiples; roofs space-8 wide at a space-7+space-2 pitch; corners radius-xs (3px, the brand's near-square corner)
-->
<rect class="t1 blk" x="256" y="-8" width="232" height="200" rx="3"/>
<rect class="t4 blk" x="32" y="200" width="208" height="96" rx="3"/>
<rect class="t3 blk" x="256" y="208" width="152" height="88" rx="3"/>
<rect class="bl blk" x="424" y="208" width="64" height="88" rx="3"/>
<path class="t2" d="M72 139L104 200H40Z"/>
<path class="t1" d="M128 139L160 200H96Z"/>
<path class="t2" d="M184 139L216 200H152Z"/>
<path class="t3" d="M300 140L320 176H280Z"/>
<path class="t3" d="M336 140L356 176H316Z"/>
<path class="t3" d="M372 140L392 176H352Z"/>
<path class="t3" d="M408 140L428 176H388Z"/>
<path class="t3" d="M444 140L464 176H424Z"/>
</svg>
</div>
<div class="words">
<h1 class="name">Recanto<br>Ferrari</h1>
<p class="tag">Design system do site do condomínio.</p>
</div>
</div>

</html>
