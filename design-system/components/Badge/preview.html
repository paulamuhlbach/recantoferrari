<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Badge</title>
<style>
  body { margin:0; padding:16px; background:var(--surface); color:var(--on-surface); font-family:var(--font-body); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.RecantoFerrari, h = React.createElement;
  function App() {
    return h('div', { className: 'row' },
      h(R.Badge, null, 'Rascunho'),
      h(R.Badge, { tone: 'primary' }, 'Novo'),
      h(R.Badge, { tone: 'info' }, 'Informativo'),
      h(R.Badge, { tone: 'success' }, 'Pago'),
      h(R.Badge, { tone: 'warning' }, 'Pendente'),
      h(R.Badge, { tone: 'error' }, 'Atrasado'),
      h(R.Badge, { tone: 'tertiary', icon: 'event' }, 'Evento'),
      h(R.Badge, { tone: 'warning', icon: 'cloud' }, 'Se chover, remarcamos'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
