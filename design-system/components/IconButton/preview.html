<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>IconButton</title>
<style>
  body { margin:0; padding:16px; background:var(--surface); color:var(--on-surface); font-family:var(--font-body); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.RecantoFerrari, h = React.createElement;
  function App() {
    return h('div', { className: 'row' },
      h(R.IconButton, { icon: 'menu', label: 'Abrir menu' }),
      h(R.IconButton, { icon: 'notifications', label: 'Notificações', variant: 'outlined' }),
      h(R.IconButton, { icon: 'add', label: 'Nova reserva', variant: 'filled' }),
      h(R.IconButton, { icon: 'search', label: 'Buscar', variant: 'tonal' }),
      h(R.IconButton, { icon: 'close', label: 'Fechar', disabled: true }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
